[[package]]
name = "climate-health-map"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "cartopy" },
    { name = "lithub", extra = ["export"] },
    { name = "matplotlib" },
    { name = "nacsos-data", extra = ["scripts", "utils"] },
    { name = "tabulate" },
    { name = "xlsxwriter" },
]

[package.optional-dependencies]
classify = [
    { name = "accelerate" },
    { name = "datasets" },
    { name = "evaluate" },
    { name = "lightgbm" },
    { name = "nltk" },
    { name = "optuna" },
    { name = "transformers", extra = ["torch"], marker = "extra == 'extra-18-climate-health-map-classify'" },
]
extract = [
    { name = "en-core-web-trf" },
    { name = "mordecai3" },
    { name = "transformers", extra = ["torch"], marker = "extra == 'extra-18-climate-health-map-extract'" },
]
notebook = [
    { name = "jupyter" },
    { name = "jupyter-contrib-nbextensions" },
    { name = "jupyter-server-fileid" },
    { name = "jupyter-server-ydoc" },
    { name = "mpl-sankey" },
    { name = "nbclassic" },
    { name = "seaborn" },
]
scatter = [
    { name = "umap-learn" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy", extra = ["faster-cache"] },
    { name = "ruff" },
]

