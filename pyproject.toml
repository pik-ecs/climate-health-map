[project]
name = "climate-health-map"
version = "0.1.0"
description = "Pipeline to keep the climate and health map up-to-date (mainly for Lancet Countdown 5.3.1/5.3.2)"
requires-python = ">=3.13"

dependencies = [
    "nacsos_data[utils,scripts] @ git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git@v0.24.45",
    "xlsxwriter==3.2.9",
    "tabulate==0.10.0",
    "tqdm==4.67.3",
    "matplotlib==3.11.0rc1",
    "lithub[export]"
]

[project.optional-dependencies]
classify = [
    "transformers[torch]==5.8.1",
    "datasets==4.8.5",
    "evaluate==0.4.6",
    "accelerate==1.13.0",
    "lightgbm==4.6.0",
    "optuna==4.8.0",
    "nltk==3.9.4",
]
gapfill = [
    "openalex_ingest @ git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-academic-search.git",
]
extract = [
    "transformers[torch]==4.57.6", #  mordecai3==3.4.0 depends on transformers>=4.2.2,<5.0
    "mordecai3==3.4.0",
    "en_core_web_trf",
]
notebook = [
    "cartopy==0.25.0",
    "seaborn==0.13.2",
    #"rasterio==1.5.0",
    "mpl-sankey==0.1.0",
    "jupyter==1.1.1",
    "jupyter_server_fileid==0.9.3",
    "jupyter_contrib_nbextensions==0.7.0",
    "jupyter_server_ydoc==2.2.1",
    "nbclassic==1.3.3",
]

[tool.uv]
prerelease = "allow"
conflicts = [
    [
      { extra = "extract" },
      { extra = "classify" },
    ],
]

[tool.uv.sources]
en_core_web_trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
mordecai3 = { git = "git+https://github.com/ahalterman/mordecai3" }
nacsos_data = { path = "../nacsos_data", editable = true }
openalex_ingest =  { path = "../nacsos-academic-search", editable = true }
#lithub = { path = "../literature-hub/packages/lithub", editable = true }
lithub = { git = "git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/living-evidence-maps/literature-hub.git", subdirectory = "packages/lithub"} # , tag="v..."

[project.scripts]
healthmap = "climate_health_map:main"

[build-system]
requires = ["uv-build>=0.9.10,<0.10.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "mypy[faster-cache]==1.19.1",
]
[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py313"
include = ["pyproject.toml", "src/**/*.py", "codepile/**/*.py"]
exclude = []

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "B9"]
ignore = ["E203", "E501", "E712", "E741", "B010", "B009", "B904", "B008"]  # , "E126", "W503",

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 12

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"


[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
follow_imports = "silent"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = false
strict_optional = true
explicit_package_bases = false
show_traceback = true
incremental = false

files = ['src/climate_health_map']
exclude = [
    'scripts\/.*'
]

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true