[project]
name = "climate-health-map"
version = "0.1.0"
description = "Pipeline to keep the climate and health map up-to-date (mainly for Lancet Countdown 5.3.1/5.3.2)"
requires-python = ">=3.13"

dependencies = [
    "nacsos_data[utils,scripts] @ git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git@v0.24.24",
    "xlsxwriter==3.2.9",
    "tabulate==0.9.0",
    "tqdm==4.67.3",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
classify = [
    "transformers[torch]==4.57.6",
    "datasets==4.5.0",
    "evaluate==0.4.6",
    "accelerate==1.11.0",
    "lightgbm==4.6.0",
    "optuna==4.5.0",
    "nltk==3.9.2",
]
extract = [
   # "mordecai3",  # FIXME
#   × No solution found when resolving dependencies for split (markers: python_full_version >= '3.14' and sys_platform == 'win32'):
#  ╰─▶ Because climate-health-map[extract] depends on mordecai3 and only mordecai3==3.0.0a0 is available, we can conclude that climate-health-map[extract] depends on mordecai3==3.0.0a0.
#      And because mordecai3==3.0.0a0 depends on pandas>=1.2.2,<2.0, we can conclude that climate-health-map[extract] depends on pandas>=1.2.2,<2.0.
#      And because nacsos-data[utils]==0.24.24 depends on pandas[excel]==3.0.0 and only nacsos-data[utils]==0.24.24 is available, we can conclude that climate-health-map[extract] and all versions of nacsos-data[utils] are incompatible.
#      And because your project depends on nacsos-data[utils] and your project requires climate-health-map[extract], we can conclude that your project's requirements are unsatisfiable.
]
notebook = [
    "cartopy==0.25.0",
    "geopandas==1.1.1",
    "jupyter==1.1.1",
    "jupyter_server_fileid==0.9.3",
    "jupyter_contrib_nbextensions==0.7.0",
    "jupyter_server_ydoc==2.1.0rc0",
    "nbclassic==1.3.3",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
mordecai3 = { git = "git+https://github.com/ahalterman/mordecai3" }
#nacsos_data = { git = "git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git", tag = "v0.24.24" }
nacsos_data = { path = "../nacsos_data", editable = true }

[project.scripts]
healthmap = "climate_health_map:main"

[build-system]
requires = ["uv-build>=0.9.10,<0.10.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "ruff>=0.14.11",
]
[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py313"
include = ["pyproject.toml", "src/**/*.py"]
exclude = []

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "B9"]
ignore = ["E203", "E501", "E712", "E741", "B010", "B009", "B904", "B008"]  # , "E126", "W503",

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 12

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
